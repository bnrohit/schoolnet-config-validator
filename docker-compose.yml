services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002}
      - DEFAULT_DNS_SERVER=${DEFAULT_DNS_SERVER:-}
      - AUTO_APPLICATION_PROBE=${AUTO_APPLICATION_PROBE:-true}
      - ENABLE_LIVE_SSH=${ENABLE_LIVE_SSH:-false}
      - REQUIRE_HTTPS_FOR_LIVE_CREDENTIALS=${REQUIRE_HTTPS_FOR_LIVE_CREDENTIALS:-true}
      - ALLOW_INSECURE_LIVE_CREDENTIALS=${ALLOW_INSECURE_LIVE_CREDENTIALS:-false}
      - ENABLE_SERVER_CREDENTIAL_PROFILES=${ENABLE_SERVER_CREDENTIAL_PROFILES:-false}
      - SSH_CREDENTIAL_PROFILES_FILE=${SSH_CREDENTIAL_PROFILES_FILE:-/run/secrets/schoolnet_ssh_profiles.json}
      - ENABLE_HTTP_OOB_LIVE=${ENABLE_HTTP_OOB_LIVE:-false}
      - SECURE_LIVE_JOB_DB=${SECURE_LIVE_JOB_DB:-/data/secure_live.sqlite3}
      - SECURE_LIVE_JOB_TTL_MINUTES=${SECURE_LIVE_JOB_TTL_MINUTES:-10}
      - ALLOW_PUBLIC_DIAGNOSTICS=${ALLOW_PUBLIC_DIAGNOSTICS:-false}
      - ENABLE_DIAGNOSTIC_HISTORY=${ENABLE_DIAGNOSTIC_HISTORY:-false}
      - DIAGNOSTIC_HISTORY_DB=${DIAGNOSTIC_HISTORY_DB:-/data/diagnostic_history.sqlite3}
      - DIAGNOSTIC_HISTORY_RETENTION=${DIAGNOSTIC_HISTORY_RETENTION:-100}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-2}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - schoolnet-history-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-.}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3002}:80"

volumes:
  schoolnet-history-data:

networks:
  default:
    name: schoolnet-validator
